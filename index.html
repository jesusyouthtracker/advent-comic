<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advent Comic Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #F9F5EB;
      --parchment: #FFFDF7;
      --pine: #1E4620;
      --pine-dark: #143015;
      --cranberry: #8B1E1E;
      --cranberry-dark: #631313;
      --gold: #C69214;
      --gold-light: #F3E5AB;
      --ink: #2C241B;
      --muted: #6E6254;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Crimson Pro', Georgia, serif;
      background-color: var(--cream);
      background-image: radial-gradient(#E5DEC9 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Gentle Snowfall Canvas */
    #snow-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* Welcome Overlay (Triggers Background Audio) */
    #welcome-overlay {
      position: fixed;
      inset: 0;
      background: rgba(249, 245, 235, 0.96);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: opacity 0.5s ease;
    }

    .welcome-card {
      background: var(--parchment);
      border: 2px dashed var(--gold);
      border-radius: 16px;
      padding: 36px 28px;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(44, 36, 27, 0.12);
    }

    .welcome-card h1 {
      font-family: 'Playfair Display', serif;
      color: var(--cranberry);
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .welcome-card p {
      font-size: 1.15rem;
      color: var(--muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .btn-primary {
      background: var(--pine);
      color: #FFF;
      border: 2px dashed rgba(255,255,255,0.4);
      padding: 12px 28px;
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .btn-primary:hover { background: var(--pine-dark); transform: translateY(-2px); }

    /* Top Bar */
    .top-bar {
      position: relative;
      z-index: 10;
      max-width: 720px;
      margin: 0 auto;
      padding: 16px 20px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .pill-btn {
      background: var(--parchment);
      border: 1px solid #D8CEBE;
      color: var(--ink);
      padding: 6px 14px;
      border-radius: 20px;
      font-family: 'Crimson Pro', serif;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .pill-btn.active {
      background: var(--gold-light);
      border-color: var(--gold);
      font-weight: 600;
    }

    /* Header */
    header {
      position: relative;
      z-index: 5;
      text-align: center;
      padding: 20px 20px 10px;
      max-width: 720px;
      margin: 0 auto;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 2.8rem);
      color: var(--cranberry);
      letter-spacing: 0.5px;
    }

    header p {
      font-size: 1.15rem;
      color: var(--muted);
      margin-top: 6px;
    }

    /* Advent Wreath Candles */
    .wreath-bar {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin: 18px 0 8px;
    }

    .candle {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .flame {
      width: 10px;
      height: 16px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      background: #D8CEBE;
      margin-bottom: 3px;
      transition: all 0.3s;
    }

    .candle.lit .flame {
      background: radial-gradient(circle, #FFF7AE 10%, #F59E0B 60%, #DC2626 100%);
      box-shadow: 0 0 12px #F59E0B;
      animation: flicker 1.6s infinite alternate;
    }

    .wax {
      width: 14px;
      height: 28px;
      border-radius: 3px;
      background: #6B21A8;
    }
    .candle:nth-child(3) .wax { background: #BE185D; } /* Gaudete Rose */

    @keyframes flicker {
      0% { transform: scale(1) rotate(-2deg); }
      100% { transform: scale(1.08) rotate(2deg); }
    }

    /* Calendar Grid & Hidden Ornaments Container */
    .calendar-wrapper {
      position: relative;
      z-index: 5;
      max-width: 680px;
      margin: 16px auto 40px;
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
    }

    @media (max-width: 520px) {
      .grid { grid-template-columns: repeat(4, 1fr); gap: 10px; }
    }

    .door {
      aspect-ratio: 1 / 1.15;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: #FFF;
      cursor: pointer;
      position: relative;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.12);
      user-select: none;
    }

    /* Stitched Border Inside Door */
    .door::after {
      content: "";
      position: absolute;
      inset: 5px;
      border: 1.5px dashed rgba(255, 255, 255, 0.45);
      border-radius: 7px;
      pointer-events: none;
    }

    .door.pine { background: var(--pine); }
    .door.cranberry { background: var(--cranberry); }

    .door.unlocked:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 8px 18px rgba(0,0,0,0.18);
    }

    .door.today {
      box-shadow: 0 0 0 3px var(--gold), 0 0 18px rgba(198, 146, 20, 0.6);
    }

    .door.locked {
      opacity: 0.55;
      cursor: not-allowed;
      filter: grayscale(0.25);
    }

    .door-badge {
      font-size: 0.75rem;
      margin-top: 4px;
      font-family: 'Crimson Pro', serif;
      font-weight: 400;
      opacity: 0.9;
    }

    /* Scattered Decorative Easter Eggs */
    .ornament {
      position: absolute;
      font-size: 1.5rem;
      cursor: pointer;
      z-index: 12;
      transition: transform 0.3s ease, opacity 0.4s ease;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15));
      user-select: none;
    }

    .ornament:hover { transform: scale(1.25) rotate(10deg); }
    .ornament.found { opacity: 0.3; transform: scale(0.85); }

    /* Blessing Counter Footer */
    footer {
      position: relative;
      z-index: 5;
      text-align: center;
      padding: 20px;
      color: var(--muted);
      font-size: 1rem;
      border-top: 1px dashed #D8CEBE;
      max-width: 680px;
      margin: 0 auto;
    }

    /* Modals (Comic Reader & Blessing Popover) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(28, 22, 16, 0.75);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open { display: flex; }

    .modal-box {
      background: var(--parchment);
      border: 2px solid var(--gold);
      border-radius: 14px;
      max-width: 560px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      position: relative;
      box-shadow: 0 16px 40px rgba(0,0,0,0.3);
    }

    .close-modal {
      position: absolute;
      top: 14px;
      right: 16px;
      background: none;
      border: none;
      font-size: 1.6rem;
      color: var(--muted);
      cursor: pointer;
    }

    .modal-day-title {
      font-family: 'Playfair Display', serif;
      color: var(--cranberry);
      font-size: 1.6rem;
      margin-bottom: 12px;
      text-align: center;
    }

    /* Multi-Panel Comic Viewer */
    .comic-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .comic-stage {
      background: #EFE9DA;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
      margin-bottom: 18px;
    }

    .comic-stage img {
      max-width: 100%;
      border-radius: 6px;
      display: block;
      margin: 0 auto;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
    }

    .comic-stage.vertical-mode img {
      margin-bottom: 12px;
    }

    .panel-nav {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 10px;
    }

    /* Scripture & Task Cards */
    .verse-card {
      background: #F4EFE2;
      border-left: 4px solid var(--cranberry);
      padding: 14px 16px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 16px;
      font-style: italic;
      font-size: 1.1rem;
    }

    .verse-ref {
      display: block;
      font-style: normal;
      font-weight: 700;
      color: var(--cranberry);
      margin-top: 6px;
      font-size: 0.95rem;
    }

    .task-card {
      background: #EDF3ED;
      border: 1.5px dashed var(--pine);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
    }

    .task-card input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--pine);
      margin-top: 3px;
      cursor: pointer;
    }

    /* Blessing Scroll Card */
    .blessing-box {
      max-width: 400px;
      text-align: center;
      padding: 30px 24px;
    }

    .blessing-icon { font-size: 2.5rem; margin-bottom: 10px; }
    .blessing-quote { font-size: 1.2rem; font-style: italic; margin-bottom: 12px; line-height: 1.5; }
    .blessing-author { font-weight: 700; color: var(--pine); }
  </style>
</head>
<body>

  <canvas id="snow-canvas"></canvas>

  <!-- Optional: Replace src with your own soft instrumental .mp3 file -->
  <audio id="bg-music" loop>
    <source src="music/advent-carol.mp3" type="audio/mpeg">
  </audio>

  <!-- Welcome Overlay -->
  <div id="welcome-overlay">
    <div class="welcome-card">
      <h1>Advent Comic Journey</h1>
      <p>25 days of illustrated story panels, daily Scripture, and quiet acts of kindness leading to Christmas.</p>
      <button class="btn-primary" onclick="enterCalendar()">Open Calendar</button>
    </div>
  </div>

  <!-- Top Controls -->
  <div class="top-bar">
    <button class="pill-btn" id="music-btn" onclick="toggleMusic()">🔇 Music Off</button>
    <button class="pill-btn" id="preview-btn" onclick="togglePreview()">🔒 Creator Preview: Off</button>
  </div>

  <!-- Header & Advent Wreath -->
  <header>
    <h1>Advent Calendar</h1>
    <p>Open one door each day of December</p>
    <div class="wreath-bar" id="wreath-bar">
      <div class="candle" data-week="1"><div class="flame"></div><div class="wax"></div><span>Hope</span></div>
      <div class="candle" data-week="2"><div class="flame"></div><div class="wax"></div><span>Peace</span></div>
      <div class="candle" data-week="3"><div class="flame"></div><div class="wax"></div><span>Joy</span></div>
      <div class="candle" data-week="4"><div class="flame"></div><div class="wax"></div><span>Love</span></div>
    </div>
  </header>

  <!-- Calendar Grid + Scattered Hidden Ornaments -->
  <main class="calendar-wrapper" id="calendar-wrapper">
    <div class="grid" id="calendar-grid"></div>
    <!-- Hidden Blessings (Populated via JS) -->
    <div id="ornaments-layer"></div>
  </main>

  <footer>
    <span id="blessing-counter">0 of 6 hidden blessings discovered</span>
  </footer>

  <!-- Daily Comic Modal -->
  <div class="modal-backdrop" id="day-modal">
    <div class="modal-box">
      <button class="close-modal" onclick="closeDayModal()">&times;</button>
      <h2 class="modal-day-title" id="modal-title">Day 1</h2>

      <div class="comic-controls">
        <span id="panel-indicator">Panel 1 of 1</span>
        <button class="pill-btn" id="layout-toggle" onclick="toggleComicLayout()">View All Panels</button>
      </div>

      <div class="comic-stage" id="comic-stage"></div>

      <div class="verse-card">
        <span id="modal-verse"></span>
        <span class="verse-ref" id="modal-ref"></span>
      </div>

      <label class="task-card">
        <input type="checkbox" id="task-checkbox" onchange="toggleTaskComplete()" />
        <div>
          <strong>Today's Small Act:</strong>
          <div id="modal-task"></div>
        </div>
      </label>
    </div>
  </div>

  <!-- Hidden Blessing Modal -->
  <div class="modal-backdrop" id="blessing-modal">
    <div class="modal-box blessing-box">
      <button class="close-modal" onclick="closeBlessingModal()">&times;</button>
      <div class="blessing-icon" id="blessing-icon">🔔</div>
      <p class="blessing-quote" id="blessing-quote"></p>
      <p class="blessing-author" id="blessing-author"></p>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. EDIT YOUR 25 DAYS HERE
    // ==========================================
    // Put your comic images in a folder called "comics/"
    // Each day can have 1 or multiple panels in the "panels" array.
    const ADVENT_DAYS = [
      {
        day: 1,
        title: "Day 1: The Journey Begins",
        panels: ["comics/day1-1.jpg", "comics/day1-2.jpg"],
        verse: "Add your chosen Scripture passage for Day 1 here.",
        ref: "Isaiah 9:2",
        task: "Light a candle tonight and pray for someone who feels lonely."
      },
      {
        day: 2,
        title: "Day 2: Quiet Preparation",
        panels: ["comics/day2-1.jpg"],
        verse: "Add your chosen Scripture passage for Day 2 here.",
        ref: "Luke 1:38",
        task: "Spend 5 minutes in complete silence without your phone."
      }
      // Copy and paste the block above for Days 3 through 25!
    ];

    // Fill remaining days automatically with placeholders until you add yours
    for (let i = ADVENT_DAYS.length + 1; i <= 25; i++) {
      ADVENT_DAYS.push({
        day: i,
        title: `Day ${i}`,
        panels: [],
        verse: "Your daily Bible verse will appear here once uploaded.",
        ref: `December ${i}`,
        task: "Your daily Advent action prompt goes here."
      });
    }

    // ==========================================
    // 2. EDIT YOUR HIDDEN ORNAMENT BLESSINGS HERE
    // ==========================================
    const HIDDEN_BLESSINGS = [
      { id: "b1", icon: "🔔", top: "2%", left: "4%", quote: "Add your favorite Catholic saint quote or reflection here.", author: "— St. Thérèse of Lisieux" },
      { id: "b2", icon: "🌿", top: "18%", right: "2%", quote: "Add a second hidden quote or verse here.", author: "— St. Francis of Assisi" },
      { id: "b3", icon: "⭐", top: "48%", left: "1%", quote: "Add a third hidden quote or verse here.", author: "— St. Augustine" },
      { id: "b4", icon: "🕯️", top: "68%", right: "2%", quote: "Add a fourth hidden quote or verse here.", author: "— St. Teresa of Calcutta" },
      { id: "b5", icon: "🌲", bottom: "6%", left: "6%", quote: "Add a fifth hidden quote or verse here.", author: "— Luke 2:14" },
      { id: "b6", icon: "🕊️", bottom: "4%", right: "8%", quote: "Add a sixth hidden quote or verse here.", author: "— John 1:5" }
    ];

    // ==========================================
    // APP LOGIC (No need to edit below)
    // ==========================================
    let previewAll = false;
    let musicPlaying = false;
    let currentDayObj = null;
    let currentPanelIdx = 0;
    let verticalMode = false;

    const completedTasks = JSON.parse(localStorage.getItem("advent_tasks") || "{}");
    const foundBlessings = JSON.parse(localStorage.getItem("advent_blessings") || "{}");

    function getUnlockedMaxDay() {
      if (previewAll) return 25;
      const now = new Date();
      // Unlocks automatically in December (Month index 11)
      if (now.getMonth() === 11) return Math.min(now.getDate(), 25);
      return 1; // Outside December, Day 1 is open so visitors can sample it
    }

    function renderCalendar() {
      const grid = document.getElementById("calendar-grid");
      grid.innerHTML = "";
      const maxDay = getUnlockedMaxDay();

      // Light Advent wreath candles based on progress
      document.querySelectorAll(".candle").forEach(c => {
        const week = parseInt(c.dataset.week, 10);
        c.classList.toggle("lit", maxDay >= (week - 1) * 7 + 1);
      });

      ADVENT_DAYS.forEach(item => {
        const isUnlocked = item.day <= maxDay;
        const isToday = item.day === maxDay && !previewAll;
        const isDone = !!completedTasks[item.day];

        const door = document.createElement("div");
        door.className = `door ${item.day % 2 === 0 ? "cranberry" : "pine"} ${isUnlocked ? "unlocked" : "locked"} ${isToday ? "today" : ""}`;
        door.innerHTML = `
          <span>${item.day}</span>
          <span class="door-badge">${isDone ? "★ Done" : isUnlocked ? "Open" : "🔒"}</span>
        `;

        if (isUnlocked) {
          door.onclick = () => openDayModal(item);
        }
        grid.appendChild(door);
      });
    }

    function renderOrnaments() {
      const layer = document.getElementById("ornaments-layer");
      layer.innerHTML = "";
      HIDDEN_BLESSINGS.forEach(b => {
        const el = document.createElement("div");
        el.className = `ornament ${foundBlessings[b.id] ? "found" : ""}`;
        el.textContent = b.icon;
        if (b.top) el.style.top = b.top;
        if (b.bottom) el.style.bottom = b.bottom;
        if (b.left) el.style.left = b.left;
        if (b.right) el.style.right = b.right;
        el.onclick = () => openBlessing(b);
        layer.appendChild(el);
      });
      const count = Object.keys(foundBlessings).length;
      document.getElementById("blessing-counter").textContent =
        `${count} of ${HIDDEN_BLESSINGS.length} hidden blessings discovered`;
    }

    function openDayModal(dayObj) {
      currentDayObj = dayObj;
      currentPanelIdx = 0;
      verticalMode = false;
      document.getElementById("modal-title").textContent = dayObj.title;
      document.getElementById("modal-verse").textContent = `"${dayObj.verse}"`;
      document.getElementById("modal-ref").textContent = dayObj.ref;
      document.getElementById("modal-task").textContent = dayObj.task;
      document.getElementById("task-checkbox").checked = !!completedTasks[dayObj.day];
      renderComicPanels();
      document.getElementById("day-modal").classList.add("open");
    }

    function renderComicPanels() {
      const stage = document.getElementById("comic-stage");
      const indicator = document.getElementById("panel-indicator");
      const toggleBtn = document.getElementById("layout-toggle");
      const panels = currentDayObj.panels;

      if (!panels || panels.length === 0) {
        stage.innerHTML = `<p style="padding:30px;color:#6E6254;">Comic artwork for Day ${currentDayObj.day} coming soon!</p>`;
        indicator.textContent = "Preview";
        toggleBtn.style.display = "none";
        return;
      }

      toggleBtn.style.display = panels.length > 1 ? "inline-block" : "none";
      toggleBtn.textContent = verticalMode ? "Carousel View" : "View All Panels";

      if (verticalMode) {
        stage.classList.add("vertical-mode");
        indicator.textContent = `${panels.length} Panels`;
        stage.innerHTML = panels.map(src => `<img src="${src}" alt="Comic panel" />`).join("");
      } else {
        stage.classList.remove("vertical-mode");
        indicator.textContent = `Panel ${currentPanelIdx + 1} of ${panels.length}`;
        stage.innerHTML = `
          <img src="${panels[currentPanelIdx]}" alt="Comic panel ${currentPanelIdx + 1}" />
          ${panels.length > 1 ? `
            <div class="panel-nav">
              <button class="pill-btn" onclick="changePanel(-1)" ${currentPanelIdx === 0 ? "disabled" : ""}>← Prev</button>
              <button class="pill-btn" onclick="changePanel(1)" ${currentPanelIdx === panels.length - 1 ? "disabled" : ""}>Next →</button>
            </div>
          ` : ""}
        `;
      }
    }

    function changePanel(delta) {
      const next = currentPanelIdx + delta;
      if (next >= 0 && next < currentDayObj.panels.length) {
        currentPanelIdx = next;
        renderComicPanels();
      }
    }

    function toggleComicLayout() {
      verticalMode = !verticalMode;
      renderComicPanels();
    }

    function toggleTaskComplete() {
      const checked = document.getElementById("task-checkbox").checked;
      if (checked) completedTasks[currentDayObj.day] = true;
      else delete completedTasks[currentDayObj.day];
      localStorage.setItem("advent_tasks", JSON.stringify(completedTasks));
      renderCalendar();
    }

    function closeDayModal() {
      document.getElementById("day-modal").classList.remove("open");
    }

    function openBlessing(b) {
      foundBlessings[b.id] = true;
      localStorage.setItem("advent_blessings", JSON.stringify(foundBlessings));
      renderOrnaments();
      document.getElementById("blessing-icon").textContent = b.icon;
      document.getElementById("blessing-quote").textContent = `"${b.quote}"`;
      document.getElementById("blessing-author").textContent = b.author;
      document.getElementById("blessing-modal").classList.add("open");
    }

    function closeBlessingModal() {
      document.getElementById("blessing-modal").classList.remove("open");
    }

    // Audio & Welcome Flow
    function enterCalendar() {
      const overlay = document.getElementById("welcome-overlay");
      overlay.style.opacity = "0";
      setTimeout(() => overlay.style.display = "none", 500);
      const audio = document.getElementById("bg-music");
      audio.volume = 0.35;
      audio.play().then(() => {
        musicPlaying = true;
        updateMusicBtn();
      }).catch(() => {});
    }

    function toggleMusic() {
      const audio = document.getElementById("bg-music");
      if (musicPlaying) {
        audio.pause();
        musicPlaying = false;
      } else {
        audio.play().catch(() => {});
        musicPlaying = true;
      }
      updateMusicBtn();
    }

    function updateMusicBtn() {
      document.getElementById("music-btn").textContent = musicPlaying ? "🔊 Music On" : "🔇 Music Off";
    }

    function togglePreview() {
      previewAll = !previewAll;
      const btn = document.getElementById("preview-btn");
      btn.textContent = previewAll ? "🔓 Creator Preview: On" : "🔒 Creator Preview: Off";
      btn.classList.toggle("active", previewAll);
      renderCalendar();
    }

    // Gentle Snowfall Effect
    const canvas = document.getElementById("snow-canvas");
    const ctx = canvas.getContext("2d");
    let flakes = [];
    function initSnow() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      flakes = Array.from({ length: 45 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2.5 + 1,
        s: Math.random() * 0.6 + 0.3
      }));
    }
    function drawSnow() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
      ctx.beginPath();
      flakes.forEach(f => {
        ctx.moveTo(f.x, f.y);
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        f.y += f.s;
        if (f.y > canvas.height) { f.y = -5; f.x = Math.random() * canvas.width; }
      });
      ctx.fill();
      requestAnimationFrame(drawSnow);
    }
    window.addEventListener("resize", initSnow);
    initSnow();
    drawSnow();

    renderCalendar();
    renderOrnaments();
  </script>
</body>
</html>
