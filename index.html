<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advent Comic Calendar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --parchment-bg: #F4EAD5;
      --parchment-card: #FCF8EE;
      --pine: #4A6B47;
      --pine-dark: #334C31;
      --cranberry: #9E332E;
      --cranberry-dark: #75221E;
      --gold: #D4A237;
      --gold-bright: #F6D365;
      --ink: #2B2118;
      --muted: #5E5042;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Crimson Pro', Georgia, serif;
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      /* Warm vintage parchment texture + soft vignette edges */
      background-color: var(--parchment-bg);
      background-image:
        radial-gradient(ellipse at center, rgba(255, 252, 244, 0.75) 0%, rgba(226, 208, 175, 0.85) 100%),
        repeating-linear-gradient(45deg, rgba(139, 115, 85, 0.03) 0px, rgba(139, 115, 85, 0.03) 2px, transparent 2px, transparent 6px);
    }

    #snow-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }

    /* Welcome Overlay */
    #welcome-overlay {
      position: fixed;
      inset: 0;
      background: rgba(244, 234, 213, 0.96);
      backdrop-filter: blur(6px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      transition: opacity 0.5s ease;
    }

    .welcome-card {
      background: var(--parchment-card);
      border: 2px solid var(--ink);
      outline: 2px dashed var(--gold);
      outline-offset: -8px;
      border-radius: 16px;
      padding: 38px 28px;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 14px 34px rgba(43, 33, 24, 0.18);
    }

    .welcome-card h1 {
      font-family: 'Playfair Display', serif;
      color: var(--cranberry);
      font-size: 2.1rem;
      margin-bottom: 10px;
    }

    .welcome-card p {
      font-size: 1.15rem;
      color: var(--muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .btn-primary {
      background: var(--pine);
      color: #FFFDF7;
      border: 2px solid var(--ink);
      padding: 12px 30px;
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--ink);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 var(--ink);
    }

    /* Top Controls */
    .top-bar {
      position: relative;
      z-index: 15;
      max-width: 680px;
      margin: 0 auto;
      padding: 14px 18px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pill-btn {
      background: var(--parchment-card);
      border: 1.5px solid var(--ink);
      color: var(--ink);
      padding: 5px 13px;
      border-radius: 20px;
      font-family: 'Crimson Pro', serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 0 rgba(43, 33, 24, 0.25);
    }

    .pill-btn.active {
      background: var(--gold-bright);
    }

    /* Two-Tone Storybook Header */
    header {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 12px 16px 4px;
      max-width: 680px;
      margin: 0 auto;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.3rem, 6vw, 3.3rem);
      font-weight: 800;
      line-height: 1.05;
      text-shadow: 1px 2px 0px rgba(255, 255, 255, 0.8);
    }

    header h1 .word-advent { color: var(--cranberry); font-style: italic; }
    header h1 .word-calendar { color: var(--pine-dark); }

    header p {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--ink);
      margin-top: 4px;
    }

    /* Advent Wreath Candles */
    .wreath-bar {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 14px 0 4px;
    }

    .candle {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
    }

    .flame {
      width: 10px;
      height: 15px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      background: #CFC3AE;
      border: 1px solid rgba(43,33,24,0.3);
      margin-bottom: 2px;
    }

    .candle.lit .flame {
      background: radial-gradient(circle, #FFFBE0 15%, #F59E0B 65%, #DC2626 100%);
      box-shadow: 0 0 12px #F59E0B;
      animation: flicker 1.5s infinite alternate;
    }

    .wax {
      width: 13px;
      height: 24px;
      border-radius: 2px;
      border: 1.5px solid var(--ink);
      background: #6B21A8;
    }
    .candle:nth-child(3) .wax { background: #BE185D; }

    @keyframes flicker {
      0% { transform: scale(1) rotate(-2deg); }
      100% { transform: scale(1.08) rotate(2deg); }
    }

    /* Main Calendar Stage with Corner Greenery */
    .calendar-stage {
      position: relative;
      max-width: 640px;
      margin: 10px auto 0;
      padding: 24px 26px 36px;
    }

    /* Decorative SVG Pine & Holly Corner Clusters */
    .corner-foliage {
      position: absolute;
      width: 115px;
      height: 115px;
      pointer-events: none;
      z-index: 8;
    }
    .foliage-tl { top: -8px; left: 2px; }
    .foliage-tr { top: -8px; right: 2px; transform: scaleX(-1); }
    .foliage-ml { top: 44%; left: -6px; width: 85px; height: 85px; }
    .foliage-mr { top: 44%; right: -6px; width: 85px; height: 85px; transform: scaleX(-1); }

    /* Grid & Tactile Storybook Doors */
    .grid {
      position: relative;
      z-index: 5;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
    }

    @media (max-width: 500px) {
      .calendar-stage { padding: 18px 16px 28px; }
      .grid { gap: 9px; }
    }

    .door {
      aspect-ratio: 1 / 1.18;
      border-radius: 4px;
      border: 2px solid var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 700;
      color: #FFFDF7;
      text-shadow: 0 1px 2px rgba(0,0,0,0.65);
      cursor: pointer;
      position: relative;
      transition: transform 0.22s ease, box-shadow 0.22s ease;
      box-shadow: 2px 3px 0px rgba(43, 33, 24, 0.35), inset 0 1px 0 rgba(255,255,255,0.25);
      user-select: none;
    }

    /* Inner Stitched Line */
    .door::before {
      content: "";
      position: absolute;
      inset: 4px;
      border: 1px dashed rgba(255, 253, 247, 0.55);
      pointer-events: none;
    }

    /* Little Brass Doorknob on Right Edge */
    .door::after {
      content: "";
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #FFF3B0, #B7791F);
      border: 1px solid var(--ink);
      box-shadow: 0 1px 1px rgba(0,0,0,0.4);
    }

    /* Hinges on Left Edge */
    .hinge-top, .hinge-bot {
      position: absolute;
      left: -2px;
      width: 4px;
      height: 8px;
      background: var(--ink);
      border-radius: 1px;
    }
    .hinge-top { top: 20%; }
    .hinge-bot { bottom: 20%; }

    .door.pine {
      background: linear-gradient(145deg, #567B52 0%, var(--pine) 60%, var(--pine-dark) 100%);
    }
    .door.cranberry {
      background: linear-gradient(145deg, #B33F3A 0%, var(--cranberry) 60%, var(--cranberry-dark) 100%);
    }

    .door.unlocked:hover {
      transform: translateY(-3px) rotate(-1deg);
      box-shadow: 3px 6px 10px rgba(43, 33, 24, 0.3);
    }

    .door.today {
      box-shadow: 0 0 0 3px var(--gold-bright), 0 0 18px rgba(212, 162, 55, 0.85);
    }

    .door.locked {
      opacity: 0.72;
      cursor: not-allowed;
    }

    .door-badge {
      font-size: 0.72rem;
      font-family: 'Crimson Pro', serif;
      font-weight: 600;
      letter-spacing: 0.3px;
      margin-top: 1px;
      opacity: 0.92;
    }

    /* Vintage Illustrated Hidden Ornaments */
    .ornament {
      position: absolute;
      width: 34px;
      height: 34px;
      cursor: pointer;
      z-index: 14;
      transition: transform 0.3s ease, opacity 0.4s ease;
      filter: drop-shadow(1px 2px 2px rgba(43, 33, 24, 0.35));
      user-select: none;
    }

    .ornament:hover { transform: scale(1.25) rotate(8deg); }
    .ornament.found { opacity: 0.35; transform: scale(0.85); }

    /* Illustrated Snowy Village Footer */
    .village-footer {
      position: relative;
      z-index: 4;
      max-width: 680px;
      margin: -18px auto 0;
      text-align: center;
    }

    .village-svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .footer-bar {
      background: var(--parchment-card);
      border-top: 2px solid var(--ink);
      padding: 12px 16px 20px;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 600;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(32, 24, 16, 0.78);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-backdrop.open { display: flex; }

    .modal-box {
      background: var(--parchment-card);
      border: 2px solid var(--ink);
      outline: 2px dashed var(--gold);
      outline-offset: -7px;
      border-radius: 14px;
      max-width: 560px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 26px;
      position: relative;
      box-shadow: 0 18px 42px rgba(0,0,0,0.35);
    }

    .close-modal {
      position: absolute;
      top: 12px;
      right: 16px;
      background: none;
      border: none;
      font-size: 1.7rem;
      color: var(--ink);
      cursor: pointer;
    }

    .modal-day-title {
      font-family: 'Playfair Display', serif;
      color: var(--cranberry);
      font-size: 1.65rem;
      margin-bottom: 12px;
      text-align: center;
    }

    .comic-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .comic-stage {
      background: #EDE3CE;
      border: 1.5px solid var(--ink);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      margin-bottom: 18px;
    }

    .comic-stage img {
      max-width: 100%;
      border-radius: 4px;
      border: 1px solid rgba(43,33,24,0.2);
      display: block;
      margin: 0 auto;
    }

    .comic-stage.vertical-mode img { margin-bottom: 12px; }

    .panel-nav {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 10px;
    }

    .verse-card {
      background: #F4EAD5;
      border-left: 4px solid var(--cranberry);
      padding: 14px 16px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 16px;
      font-style: italic;
      font-size: 1.12rem;
    }

    .verse-ref {
      display: block;
      font-style: normal;
      font-weight: 700;
      color: var(--cranberry);
      margin-top: 6px;
      font-size: 0.95rem;
    }

    .task-card {
      background: #E9F0E8;
      border: 1.5px dashed var(--pine-dark);
      border-radius: 8px;
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      cursor: pointer;
    }

    .task-card input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--pine-dark);
      margin-top: 3px;
      cursor: pointer;
    }

    .blessing-box {
      max-width: 400px;
      text-align: center;
      padding: 32px 24px;
    }

    .blessing-icon { width: 52px; height: 52px; margin: 0 auto 12px; }
    .blessing-quote { font-size: 1.2rem; font-style: italic; margin-bottom: 12px; line-height: 1.5; }
    .blessing-author { font-weight: 700; color: var(--pine-dark); }
  </style>
</head>
<body>

  <canvas id="snow-canvas"></canvas>

  <audio id="bg-music" loop>
    <source src="music/advent-carol.mp3" type="audio/mpeg">
  </audio>

  <!-- Welcome Overlay -->
  <div id="welcome-overlay">
    <div class="welcome-card">
      <h1>Advent Comic Journey</h1>
      <p>25 days of illustrated story panels, daily Scripture, and quiet acts of kindness leading to Christmas.</p>
      <button class="btn-primary" onclick="enterCalendar()">Open Calendar</button>
    </div>
  </div>

  <!-- Top Bar -->
  <div class="top-bar">
    <button class="pill-btn" id="music-btn" onclick="toggleMusic()">🔇 Music Off</button>
    <button class="pill-btn" id="preview-btn" onclick="togglePreview()">🔒 Creator Preview: Off</button>
  </div>

  <!-- Storybook Header -->
  <header>
    <h1><span class="word-advent">Advent</span> <span class="word-calendar">Calendar</span></h1>
    <p>Days to Christmas: Countdown</p>
    <div class="wreath-bar">
      <div class="candle" data-week="1"><div class="flame"></div><div class="wax"></div><span>Hope</span></div>
      <div class="candle" data-week="2"><div class="flame"></div><div class="wax"></div><span>Peace</span></div>
      <div class="candle" data-week="3"><div class="flame"></div><div class="wax"></div><span>Joy</span></div>
      <div class="candle" data-week="4"><div class="flame"></div><div class="wax"></div><span>Love</span></div>
    </div>
  </header>

  <!-- Calendar Grid with Illustrated Pine Corner Clusters -->
  <main class="calendar-stage">
    <!-- Top-Left Pine & Holly SVG -->
    <svg class="corner-foliage foliage-tl" viewBox="0 0 120 120" fill="none">
      <path d="M12 95 C25 55, 55 25, 105 14" stroke="#2B2118" stroke-width="3" stroke-linecap="round"/>
      <path d="M22 72 L8 58 M34 58 L16 42 M48 44 L30 26 M64 32 L48 14 M82 22 L68 8" stroke="#334C31" stroke-width="4" stroke-linecap="round"/>
      <path d="M28 76 L44 88 M42 62 L60 72 M56 48 L74 56 M72 34 L90 40" stroke="#4A6B47" stroke-width="4" stroke-linecap="round"/>
      <circle cx="28" cy="36" r="5" fill="#9E332E" stroke="#2B2118" stroke-width="1.5"/>
      <circle cx="37" cy="41" r="4.5" fill="#B33F3A" stroke="#2B2118" stroke-width="1.5"/>
      <circle cx="31" cy="46" r="4.5" fill="#9E332E" stroke="#2B2118" stroke-width="1.5"/>
    </svg>

    <!-- Top-Right Pine & Holly SVG -->
    <svg class="corner-foliage foliage-tr" viewBox="0 0 120 120" fill="none">
      <path d="M12 95 C25 55, 55 25, 105 14" stroke="#2B2118" stroke-width="3" stroke-linecap="round"/>
      <path d="M22 72 L8 58 M34 58 L16 42 M48 44 L30 26 M64 32 L48 14 M82 22 L68 8" stroke="#334C31" stroke-width="4" stroke-linecap="round"/>
      <path d="M28 76 L44 88 M42 62 L60 72 M56 48 L74 56 M72 34 L90 40" stroke="#4A6B47" stroke-width="4" stroke-linecap="round"/>
      <circle cx="28" cy="36" r="5" fill="#9E332E" stroke="#2B2118" stroke-width="1.5"/>
      <circle cx="37" cy="41" r="4.5" fill="#B33F3A" stroke="#2B2118" stroke-width="1.5"/>
    </svg>

    <!-- Mid-Left & Mid-Right Holly Sprigs -->
    <svg class="corner-foliage foliage-ml" viewBox="0 0 90 90" fill="none">
      <path d="M10 45 Q35 20 55 45 Q35 70 10 45 Z" fill="#4A6B47" stroke="#2B2118" stroke-width="1.8"/>
      <circle cx="22" cy="45" r="4.5" fill="#9E332E" stroke="#2B2118" stroke-width="1.5"/>
      <circle cx="29" cy="40" r="4" fill="#B33F3A" stroke="#2B2118" stroke-width="1.5"/>
    </svg>
    <svg class="corner-foliage foliage-mr" viewBox="0 0 90 90" fill="none">
      <path d="M10 45 Q35 20 55 45 Q35 70 10 45 Z" fill="#4A6B47" stroke="#2B2118" stroke-width="1.8"/>
      <circle cx="22" cy="45" r="4.5" fill="#9E332E" stroke="#2B2118" stroke-width="1.5"/>
      <circle cx="29" cy="40" r="4" fill="#B33F3A" stroke="#2B2118" stroke-width="1.5"/>
    </svg>

    <div class="grid" id="calendar-grid"></div>
    <div id="ornaments-layer"></div>
  </main>

  <!-- Illustrated Winter Village Footer -->
  <footer class="village-footer">
    <svg class="village-svg" viewBox="0 0 680 145" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Dusk Winter Sky -->
      <path d="M0 45 Q170 20 340 40 T680 30 L680 145 L0 145 Z" fill="#4E616E"/>
      <!-- Distant Snowy Hills -->
      <path d="M0 95 Q160 65 340 92 T680 80 L680 145 L0 145 Z" fill="#E8DFCA" stroke="#2B2118" stroke-width="1.8"/>
      <path d="M0 112 Q220 90 440 114 T680 102 L680 145 L0 145 Z" fill="#F9F4E8" stroke="#2B2118" stroke-width="1.8"/>
      <!-- Left Pine Trees -->
      <polygon points="48,42 24,105 72,105" fill="#334C31" stroke="#2B2118" stroke-width="1.8"/>
      <polygon points="48,30 30,72 66,72" fill="#4A6B47" stroke="#2B2118" stroke-width="1.8"/>
      <polygon points="95,58 76,110 114,110" fill="#4A6B47" stroke="#2B2118" stroke-width="1.8"/>
      <!-- Cozy Left Cottage -->
      <rect x="145" y="82" width="54" height="36" fill="#D8C3A5" stroke="#2B2118" stroke-width="1.8"/>
      <polygon points="138,82 172,56 206,82" fill="#9E332E" stroke="#2B2118" stroke-width="1.8"/>
      <!-- Snow Roof Cap -->
      <path d="M138 82 L172 56 L206 82" stroke="#FFFDF7" stroke-width="4" stroke-linecap="round"/>
      <!-- Glowing Cottage Window -->
      <rect x="164" y="92" width="14" height="14" fill="#F6D365" stroke="#2B2118" stroke-width="1.5"/>
      <!-- Chimney Smoke -->
      <path d="M188 64 Q194 50 186 38 Q180 28 190 18" stroke="#FFFDF7" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

      <!-- Center Distant Chapel Spire -->
      <rect x="332" y="76" width="22" height="28" fill="#E8DFCA" stroke="#2B2118" stroke-width="1.5"/>
      <polygon points="330,76 343,48 356,76" fill="#75221E" stroke="#2B2118" stroke-width="1.5"/>
      <path d="M343 39 V48 M339 43 H347" stroke="#2B2118" stroke-width="1.8" stroke-linecap="round"/>

      <!-- Right Cozy Cottage -->
      <rect x="475" y="84" width="58" height="36" fill="#C9B190" stroke="#2B2118" stroke-width="1.8"/>
      <polygon points="468,84 504,58 540,84" fill="#4A6B47" stroke="#2B2118" stroke-width="1.8"/>
      <path d="M468 84 L504 58 L540 84" stroke="#FFFDF7" stroke-width="4" stroke-linecap="round"/>
      <rect x="490" y="94" width="13" height="13" fill="#F6D365" stroke="#2B2118" stroke-width="1.5"/>
      <rect x="510" y="94" width="13" height="13" fill="#F6D365" stroke="#2B2118" stroke-width="1.5"/>

      <!-- Right Pine Trees -->
      <polygon points="585,52 564,108 606,108" fill="#4A6B47" stroke="#2B2118" stroke-width="1.8"/>
      <polygon points="632,38 608,106 656,106" fill="#334C31" stroke="#2B2118" stroke-width="1.8"/>
    </svg>
    <div class="footer-bar">
      <span id="blessing-counter">0 of 6 hidden blessings discovered</span>
    </div>
  </footer>

  <!-- Daily Comic Modal -->
  <div class="modal-backdrop" id="day-modal">
    <div class="modal-box">
      <button class="close-modal" onclick="closeDayModal()">&times;</button>
      <h2 class="modal-day-title" id="modal-title">Day 1</h2>

      <div class="comic-controls">
        <span id="panel-indicator">Panel 1 of 1</span>
        <button class="pill-btn" id="layout-toggle" onclick="toggleComicLayout()">View All Panels</button>
      </div>

      <div class="comic-stage" id="comic-stage"></div>

      <div class="verse-card">
        <span id="modal-verse"></span>
        <span class="verse-ref" id="modal-ref"></span>
      </div>

      <label class="task-card">
        <input type="checkbox" id="task-checkbox" onchange="toggleTaskComplete()" />
        <div>
          <strong>Today's Small Act:</strong>
          <div id="modal-task"></div>
        </div>
      </label>
    </div>
  </div>

  <!-- Hidden Blessing Modal -->
  <div class="modal-backdrop" id="blessing-modal">
    <div class="modal-box blessing-box">
      <button class="close-modal" onclick="closeBlessingModal()">&times;</button>
      <div class="blessing-icon" id="blessing-icon"></div>
      <p class="blessing-quote" id="blessing-quote"></p>
      <p class="blessing-author" id="blessing-author"></p>
    </div>
  </div>

  <script>
    // ==========================================
    // 1. EDIT YOUR 25 DAYS HERE
    // ==========================================
    const ADVENT_DAYS = [
      {
        day: 1,
        title: "Day 1: The Journey Begins",
        panels: ["comics/day1-1.jpg", "comics/day1-2.jpg"],
        verse: "Add your chosen Scripture passage for Day 1 here.",
        ref: "Isaiah 9:2",
        task: "Light a candle tonight and pray for someone who feels lonely."
      },
      {
        day: 2,
        title: "Day 2: Quiet Preparation",
        panels: ["comics/day2-1.jpg"],
        verse: "Add your chosen Scripture passage for Day 2 here.",
        ref: "Luke 1:38",
        task: "Spend 5 minutes in complete silence without your phone."
      }
    ];

    for (let i = ADVENT_DAYS.length + 1; i <= 25; i++) {
      ADVENT_DAYS.push({
        day: i,
        title: `Day ${i}`,
        panels: [],
        verse: "Your daily Bible verse will appear here once uploaded.",
        ref: `December ${i}`,
        task: "Your daily Advent action prompt goes here."
      });
    }

    // ==========================================
    // 2. VINTAGE ILLUSTRATED ORNAMENTS & QUOTES
    // ==========================================
    const SVG_ICONS = {
      bell: `<svg viewBox="0 0 36 36" fill="none"><path d="M18 5 C12 5 9 10 9 17 L6 24 H30 L27 17 C27 10 24 5 18 5 Z" fill="#D4A237" stroke="#2B2118" stroke-width="2"/><circle cx="18" cy="27" r="3" fill="#9E332E" stroke="#2B2118" stroke-width="1.5"/><path d="M14 5 Q18 2 22 5" stroke="#9E332E" stroke-width="2.5" stroke-linecap="round"/></svg>`,
      star: `<svg viewBox="0 0 36 36" fill="none"><polygon points="18,3 22,13 33,14 25,21 27,32 18,26 9,32 11,21 3,14 14,13" fill="#F6D365" stroke="#2B2118" stroke-width="1.8"/></svg>`,
      holly: `<svg viewBox="0 0 36 36" fill="none"><path d="M6 18 Q18 8 30 18 Q18 28 6 18 Z" fill="#4A6B47" stroke="#2B2118" stroke-width="1.8"/><circle cx="16" cy="18" r="3.5" fill="#9E332E" stroke="#2B2118" stroke-width="1.4"/><circle cx="22" cy="15" r="3" fill="#B33F3A" stroke="#2B2118" stroke-width="1.4"/></svg>`,
      candle: `<svg viewBox="0 0 36 36" fill="none"><path d="M18 4 C15 9 15 12 18 14 C21 12 21 9 18 4 Z" fill="#F59E0B" stroke="#2B2118" stroke-width="1.4"/><rect x="13" y="15" width="10" height="16" rx="2" fill="#FFFDF7" stroke="#2B2118" stroke-width="1.8"/></svg>`,
      pinecone: `<svg viewBox="0 0 36 36" fill="none"><ellipse cx="18" cy="19" rx="8" ry="11" fill="#7C5233" stroke="#2B2118" stroke-width="1.8"/><path d="M12 15 Q18 19 24 15 M11 21 Q18 25 25 21" stroke="#2B2118" stroke-width="1.5"/></svg>`,
      dove: `<svg viewBox="0 0 36 36" fill="none"><path d="M8 20 C12 12 20 12 28 10 C24 16 26 22 18 25 C13 26 9 23 8 20 Z" fill="#FFFDF7" stroke="#2B2118" stroke-width="1.8"/><path d="M15 16 L11 9 L20 14" fill="#F4EAD5" stroke="#2B2118" stroke-width="1.6"/></svg>`
    };

    const HIDDEN_BLESSINGS = [
      { id: "b1", type: "bell", top: "2%", right: "1%", quote: "Add your favorite Catholic saint quote or reflection here.", author: "— St. Thérèse of Lisieux" },
      { id: "b2", type: "holly", top: "24%", left: "1%", quote: "Add a second hidden quote or verse here.", author: "— St. Francis of Assisi" },
      { id: "b3", type: "star", top: "48%", right: "1%", quote: "Add a third hidden quote or verse here.", author: "— St. Augustine" },
      { id: "b4", type: "candle", top: "68%", left: "1%", quote: "Add a fourth hidden quote or verse here.", author: "— St. Teresa of Calcutta" },
      { id: "b5", type: "pinecone", bottom: "4%", left: "3%", quote: "Add a fifth hidden quote or verse here.", author: "— Luke 2:14" },
      { id: "b6", type: "dove", bottom: "4%", right: "3%", quote: "Add a sixth hidden quote or verse here.", author: "— John 1:5" }
    ];

    // ==========================================
    // APP LOGIC
    // ==========================================
    let previewAll = false;
    let musicPlaying = false;
    let currentDayObj = null;
    let currentPanelIdx = 0;
    let verticalMode = false;

    const completedTasks = JSON.parse(localStorage.getItem("advent_tasks") || "{}");
    const foundBlessings = JSON.parse(localStorage.getItem("advent_blessings") || "{}");

    function getUnlockedMaxDay() {
      if (previewAll) return 25;
      const now = new Date();
      if (now.getMonth() === 11) return Math.min(now.getDate(), 25);
      return 1;
    }

    function renderCalendar() {
      const grid = document.getElementById("calendar-grid");
      grid.innerHTML = "";
      const maxDay = getUnlockedMaxDay();

      document.querySelectorAll(".candle").forEach(c => {
        const week = parseInt(c.dataset.week, 10);
        c.classList.toggle("lit", maxDay >= (week - 1) * 7 + 1);
      });

      ADVENT_DAYS.forEach(item => {
        const isUnlocked = item.day <= maxDay;
        const isToday = item.day === maxDay && !previewAll;
        const isDone = !!completedTasks[item.day];

        const door = document.createElement("div");
        door.className = `door ${item.day % 2 === 0 ? "cranberry" : "pine"} ${isUnlocked ? "unlocked" : "locked"} ${isToday ? "today" : ""}`;
        door.innerHTML = `
          <span class="hinge-top"></span>
          <span class="hinge-bot"></span>
          <span>${item.day}</span>
          <span class="door-badge">${isDone ? "★ Done" : isUnlocked ? "Open" : "🔒"}</span>
        `;

        if (isUnlocked) door.onclick = () => openDayModal(item);
        grid.appendChild(door);
      });
    }

    function renderOrnaments() {
      const layer = document.getElementById("ornaments-layer");
      layer.innerHTML = "";
      HIDDEN_BLESSINGS.forEach(b => {
        const el = document.createElement("div");
        el.className = `ornament ${foundBlessings[b.id] ? "found" : ""}`;
        el.innerHTML = SVG_ICONS[b.type];
        if (b.top) el.style.top = b.top;
        if (b.bottom) el.style.bottom = b.bottom;
        if (b.left) el.style.left = b.left;
        if (b.right) el.style.right = b.right;
        el.onclick = () => openBlessing(b);
        layer.appendChild(el);
      });
      const count = Object.keys(foundBlessings).length;
      document.getElementById("blessing-counter").textContent =
        `${count} of ${HIDDEN_BLESSINGS.length} hidden blessings discovered`;
    }

    function openDayModal(dayObj) {
      currentDayObj = dayObj;
      currentPanelIdx = 0;
      verticalMode = false;
      document.getElementById("modal-title").textContent = dayObj.title;
      document.getElementById("modal-verse").textContent = `"${dayObj.verse}"`;
      document.getElementById("modal-ref").textContent = dayObj.ref;
      document.getElementById("modal-task").textContent = dayObj.task;
      document.getElementById("task-checkbox").checked = !!completedTasks[dayObj.day];
      renderComicPanels();
      document.getElementById("day-modal").classList.add("open");
    }

    function renderComicPanels() {
      const stage = document.getElementById("comic-stage");
      const indicator = document.getElementById("panel-indicator");
      const toggleBtn = document.getElementById("layout-toggle");
      const panels = currentDayObj.panels;

      if (!panels || panels.length === 0) {
        stage.innerHTML = `<p style="padding:30px;color:#5E5042;">Comic artwork for Day ${currentDayObj.day} coming soon!</p>`;
        indicator.textContent = "Preview";
        toggleBtn.style.display = "none";
        return;
      }

      toggleBtn.style.display = panels.length > 1 ? "inline-block" : "none";
      toggleBtn.textContent = verticalMode ? "Carousel View" : "View All Panels";

      if (verticalMode) {
        stage.classList.add("vertical-mode");
        indicator.textContent = `${panels.length} Panels`;
        stage.innerHTML = panels.map(src => `<img src="${src}" alt="Comic panel" />`).join("");
      } else {
        stage.classList.remove("vertical-mode");
        indicator.textContent = `Panel ${currentPanelIdx + 1} of ${panels.length}`;
        stage.innerHTML = `
          <img src="${panels[currentPanelIdx]}" alt="Comic panel ${currentPanelIdx + 1}" />
          ${panels.length > 1 ? `
            <div class="panel-nav">
              <button class="pill-btn" onclick="changePanel(-1)" ${currentPanelIdx === 0 ? "disabled" : ""}>← Prev</button>
              <button class="pill-btn" onclick="changePanel(1)" ${currentPanelIdx === panels.length - 1 ? "disabled" : ""}>Next →</button>
            </div>
          ` : ""}
        `;
      }
    }

    function changePanel(delta) {
      const next = currentPanelIdx + delta;
      if (next >= 0 && next < currentDayObj.panels.length) {
        currentPanelIdx = next;
        renderComicPanels();
      }
    }

    function toggleComicLayout() {
      verticalMode = !verticalMode;
      renderComicPanels();
    }

    function toggleTaskComplete() {
      const checked = document.getElementById("task-checkbox").checked;
      if (checked) completedTasks[currentDayObj.day] = true;
      else delete completedTasks[currentDayObj.day];
      localStorage.setItem("advent_tasks", JSON.stringify(completedTasks));
      renderCalendar();
    }

    function closeDayModal() { document.getElementById("day-modal").classList.remove("open"); }

    function openBlessing(b) {
      foundBlessings[b.id] = true;
      localStorage.setItem("advent_blessings", JSON.stringify(foundBlessings));
      renderOrnaments();
      document.getElementById("blessing-icon").innerHTML = SVG_ICONS[b.type];
      document.getElementById("blessing-quote").textContent = `"${b.quote}"`;
      document.getElementById("blessing-author").textContent = b.author;
      document.getElementById("blessing-modal").classList.add("open");
    }

    function closeBlessingModal() { document.getElementById("blessing-modal").classList.remove("open"); }

    function enterCalendar() {
      const overlay = document.getElementById("welcome-overlay");
      overlay.style.opacity = "0";
      setTimeout(() => overlay.style.display = "none", 500);
      const audio = document.getElementById("bg-music");
      audio.volume = 0.35;
      audio.play().then(() => { musicPlaying = true; updateMusicBtn(); }).catch(() => {});
    }

    function toggleMusic() {
      const audio = document.getElementById("bg-music");
      if (musicPlaying) { audio.pause(); musicPlaying = false; }
      else { audio.play().catch(() => {}); musicPlaying = true; }
      updateMusicBtn();
    }

    function updateMusicBtn() {
      document.getElementById("music-btn").textContent = musicPlaying ? "🔊 Music On" : "🔇 Music Off";
    }

    function togglePreview() {
      previewAll = !previewAll;
      const btn = document.getElementById("preview-btn");
      btn.textContent = previewAll ? "🔓 Creator Preview: On" : "🔒 Creator Preview: Off";
      btn.classList.toggle("active", previewAll);
      renderCalendar();
    }

    // Snowfall
    const canvas = document.getElementById("snow-canvas");
    const ctx = canvas.getContext("2d");
    let flakes = [];
    function initSnow() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      flakes = Array.from({ length: 45 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 2.5 + 1,
        s: Math.random() * 0.6 + 0.3
      }));
    }
    function drawSnow() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "rgba(255, 255, 255, 0.88)";
      ctx.beginPath();
      flakes.forEach(f => {
        ctx.moveTo(f.x, f.y);
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        f.y += f.s;
        if (f.y > canvas.height) { f.y = -5; f.x = Math.random() * canvas.width; }
      });
      ctx.fill();
      requestAnimationFrame(drawSnow);
    }
    window.addEventListener("resize", initSnow);
    initSnow();
    drawSnow();

    renderCalendar();
    renderOrnaments();
  </script>
</body>
</html>
